# 🧠 MadiLang v0.4 — Sovereign Intent-Driven Programming Language
# ════════════════════════════════════════════════════════════════════════════
# Author: El Madani El Mkhitar (madani004)
# Philosophy: Mkhitarian Ontology — Human Intent as Sovereign Layer
# Status: Active Development • Mobile-First • Ethics-by-Default
# ════════════════════════════════════════════════════════════════════════════

[project]
name = "madilang"
version = "0.4.0"
description = "Intent-driven programming language that generates secure backend systems from human-readable descriptions. Code is no longer written; it is described."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

authors = [
    { name = "El Madani El Mkhitar", email = "madani004@proton.me" }
]

maintainers = [
    { name = "El Madani El Mkhitar", email = "madani004@proton.me" }
]

keywords = [
    "programming-language",
    "intent-driven",
    "code-generation",
    "sovereignty",
    "web3",
    "ai",
    "low-code",
    "ethics",
    "mobile-first"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Operating System :: OS Independent"
]

dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[project.scripts]
madi = "madilang.cli.main:main"

[project.urls]
Homepage = "https://github.com/madanimkhitar22-beep/madilang"
Documentation = "https://github.com/madanimkhitar22-beep/madilang/tree/main/docs"
Repository = "https://github.com/madanimkhitar22-beep/madilang.git"
"Author Profile" = "https://github.com/madanimkhitar22-beep"
"Mkhitarian Philosophy" = "https://github.com/madanimkhitar22-beep/Mekhitarian-Philosophy"
"Sovereign Cognition" = "https://github.com/madanimkhitar22-beep/-Sovereign-Cognition-Engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madilang"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
