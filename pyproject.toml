# 🧠 MadiLang v0.5.0 — Sovereign Intent-Driven Programming Language
# ════════════════════════════════════════════════════════════════════════════
# Author: El Madani El Mkhitar (madani004)
# Philosophy: Mkhitarian Ontology — Human Intent as Sovereign Layer
# Status: Beta • Mobile-First • Ethics-by-Default • Multi-Target
# ════════════════════════════════════════════════════════════════════════════

[project]
name = "madilang"
version = "0.5.0"
description = "Sovereign intent-driven programming language. Describe what you want, MadiLang generates secure, ethical, production-ready backends with cryptographic proof of origin. Mobile-first • Multi-target (Node.js + Python) • Zero-config diagnostics."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"

authors = [
    { name = "El Madani El Mkhitar", email = "madani004@proton.me" }
]

maintainers = [
    { name = "El Madani El Mkhitar", email = "madani004@proton.me" }
]

keywords = [
    "programming-language",
    "intent-driven",
    "code-generation",
    "sovereignty",
    "web3",
    "ai",
    "low-code",
    "ethics",
    "mobile-first",
    "fastapi",
    "nodejs",
    "termux",
    "diagnostics"
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Compilers",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Security :: Cryptography",
    "Operating System :: OS Independent",
    "Operating System :: POSIX :: Linux",
    "Environment :: Console"
]

dependencies = [
    "pyjwt>=2.8.0",
    "cryptography>=41.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0"
]
python = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0"
]

[project.scripts]
madi = "madilang.cli.main:main"

[project.urls]
Homepage = "https://github.com/madanimkhitar22-beep/madilang"
Documentation = "https://github.com/madanimkhitar22-beep/madilang/wiki"
Repository = "https://github.com/madanimkhitar22-beep/madilang.git"
Changelog = "https://github.com/madanimkhitar22-beep/madilang/blob/main/CHANGELOG.md"
"Dev.to Article" = "https://dev.to/madanimkhitar22beep/madilang-building-a-sovereign-programming-language-entirely-on-a-smartphone-4fpo"
"Author Profile" = "https://github.com/madanimkhitar22-beep"
"Mkhitarian Philosophy" = "https://github.com/madanimkhitar22-beep/Mekhitarian-Philosophy"
"Sovereign Cognition" = "https://github.com/madanimkhitar22-beep/-Sovereign-Cognition-Engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["madilang"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.black]
line-length = 88
target-version = ["py38"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
